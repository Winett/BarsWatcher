<script>
    window.AUTH_CODE_LENGTH = 4;

    function af2_code_send(btnId, url, tid, af2_len) {
        window.AUTH_CODE_LENGTH = parseInt(af2_len);
        const codeInput = document.getElementById('AF2_Code');
        codeInput.setAttribute('maxlength', af2_len);

        var btn = document.getElementById(btnId);
        var $btn = $(btn);
        if (is_spinned($btn))
            return;

        var text = btn.getAttribute("data-text");

        btn.textContent = "Отправка сообщения";
        spin_a($btn);

        url = url + "?tid=" + tid;

        $.ajax({
            cache: false,
            type: 'GET',
            url: url,
            success: function(result) {
                unspin_a($btn);
                btn.textContent = text;

                if (!result.success) {
                    var error = "При выполнении запроса произошла ошибка. Попробуйте позже или обратитесь в техническую поддержку.";
                    if (result.error) {
                        error = result.error;
                    }

                    notifyError(error, 30000);
                    return;
                }

                notifySuccess(result.message, 5000);
            },
            error: function(xhr, ajaxOptions, thrownError) {
                unspin_a($btn);
                btn.textContent = text;

                showError(xhr);
            }
        });
    }

    $(document).ready(function() {


                af2_code_send('btnSend', '/bars_web/Auth/JSON_SendAF2_Code', '5', '6');


        const input = document.getElementById('AF2_Code');

        input.addEventListener('input', function (e) {
            this.value = this.value.replace(/\D/g, '');
            if (this.value.length !== window.AUTH_CODE_LENGTH)
                return;

            login();
        });

        input.addEventListener('paste', function (e) {
            this.value = this.value.replace(/\D/g, '');
            if (this.value.length !== window.AUTH_CODE_LENGTH)
                return;

            login();
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.keyCode === 13 || e.which === 13) {
                login();
            }
        });

        input.focus();
    });
</script>
