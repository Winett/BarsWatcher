<script>
    function exportToExcel(url, mode)
    {
        url += "&mode=" + mode;
        document.location = url;
    };

    function editLessonStudentMany(tableID, url) {
        var checkedIDs = getCheckedTRsData(tableID, 'ls-id');
        if (checkedIDs.length === 0) {
            notifyError("Выберите посещения");
            return;
        }

        var srcElement = $(this);
        var data = {
            'checkedIDs': checkedIDs.join()
        };
        var bindData = { func: callbackShowModal, target: 'div-Student__Lesson' };
        ajaxPostLoadModal(srcElement, url, data, bindData);
    }

    function checkUncheckAll(e) {
        $("#tbl__PartialListStudent__Lesson__Student tr[data-ls-id] td input[type='checkbox']").prop("checked", e.checked);
    }

    function getQuery__PartialListStudent__Lesson__Student(clickedElem) {
        var table = document.getElementById('tbl__PartialListStudent__Lesson__Student');
        var query = {};
        query.ID = table.getAttribute('data-q-id');
        query.State = table.getAttribute('data-q-state');

        if (query.State !== "1") {
            query.SortOrder = table.getAttribute('data-q-sort-order');
            query.Page = table.getAttribute('data-q-page');
            query.PageSize = table.getAttribute('data-q-page-size');
            query.SearchText = ENtoRU($('#st_les__Search').val().trim());

            query.FilterStartDate = $('#dp_FilterStartDate').val().trim();
            query.FilterEndDate = $('#dp_FilterEndDate').val().trim();

            query.FilterSemester = {};
            var ddl_LessonStudent_FilterSemester = $("#ddl_LessonStudent_FilterSemester");
            if (ddl_LessonStudent_FilterSemester.length !== 0) {
                query.FilterSemester.Value = ddl_LessonStudent_FilterSemester.find("option:selected").val();
            }

            query.FilterLessonSkipType = {};
            var ddl_FilterLessonSkipType = $("#ddl_FilterLessonSkipType");
            if (ddl_FilterLessonSkipType.length !== 0) {
                query.FilterLessonSkipType.Value = ddl_FilterLessonSkipType.find("option:selected").val();
            }

            query.FilterLessonSkipReason = {};
            var ddl_FilterLessonSkipReason = $("#ddl_FilterLessonSkipReason");
            if (ddl_FilterLessonSkipReason.length !== 0) {
                query.FilterLessonSkipReason.Value = ddl_FilterLessonSkipReason.find("option:selected").val();
            }
        }

        return JSON.stringify(query);
    }

    $(document).ready(function () {
        $('#ddl_LessonStudent_FilterSemester').selectpicker({ styleBase: 'btn btn-light border border-secondary rounded-0' });

        S2_simpleModal("#ddl_FilterLessonSkipType", -1, false, '', '#divListFilters');
        S2_simpleModal("#ddl_FilterLessonSkipReason", -1, false, '', '#divListFilters');

        $('#dp_FilterStartDate,#dp_FilterEndDate').datepicker({
            language: "ru"
            , format: "dd.mm.yyyy"
            , autoclose: true
            , todayBtn: "linked"
            , clearBtn: true
            , daysOfWeekHighlighted: "0,6"
        });

        $('#divListFilters').on("click.bs.dropdown", function (e) {
            return false;
        });
    });

</script>

<script type="text/javascript">
    function filter__PartialListStudent__Lesson__Student() {
                var table = document.getElementById('tbl__PartialListStudent__Lesson__Student');
                table.setAttribute('data-q-page', '');
                loadTableByQueryAsyncV2(table, 'div-Student__Lesson', getQuery__PartialListStudent__Lesson__Student, this);
                return false;
            }

            function filter_clear__PartialListStudent__Lesson__Student() {
                var table = document.getElementById('tbl__PartialListStudent__Lesson__Student');
                table.setAttribute('data-q-state', '1');
                loadTableByQueryAsyncV2(table, 'div-Student__Lesson', getQuery__PartialListStudent__Lesson__Student, this);
                return false;
            }

            $(function()
            {
                $('#st_les__Pager a').on('click', function() {
                    var table = document.getElementById('tbl__PartialListStudent__Lesson__Student');
                    var parts = this.href.split('/')
                    var page = 0;
                    if(parts.length > 0) {
                        page = parts[parts.length - 1];
                    }
                    table.setAttribute('data-q-page', page);
                    loadTableByQueryAsyncV2(table, 'div-Student__Lesson', getQuery__PartialListStudent__Lesson__Student, this);
                    return false;
                });

                $('#st_les__Pager select:first').change(function() {
                    var table = document.getElementById('tbl__PartialListStudent__Lesson__Student');
                    table.setAttribute('data-q-page-size', $(this).val());
                    table.setAttribute('data-q-page', 1);
                    loadTableByQueryAsyncV2(table, 'div-Student__Lesson', getQuery__PartialListStudent__Lesson__Student, this);
                });

                $('#st_les__Filter').on('click', function() {
                    filter__PartialListStudent__Lesson__Student();
                });

                $('#st_les__FilterClear').on('click', function() {
                    filter_clear__PartialListStudent__Lesson__Student();
                });

                $('#st_les__Search').keypress(function(e) {
                    if (e.which === 13)
                    {
                        filter__PartialListStudent__Lesson__Student();
                    }
                });

                $('#tbl__PartialListStudent__Lesson__Student thead tr th a[data-col-name]').on('click', function(e) {
                    var table = document.getElementById('tbl__PartialListStudent__Lesson__Student');
                    if (!e.shiftKey)
                    {
                        table.setAttribute('data-q-sort-order', '');
                    }
                    processSortOrder(table, this);
                    loadTableByQueryAsyncV2(table, 'div-Student__Lesson', getQuery__PartialListStudent__Lesson__Student, this);
                    return false;
                });
            });
</script>
