<script type="text/javascript">
    function getQuery__PartialListStudyGroup_Leaders()
            {
                var table = document.getElementById('tbl__PartialListStudyGroup_Leaders');
                var query = { };
                query.ID = table.getAttribute('data-q-id');
                query.State = table.getAttribute('data-q-state');

                if (query.State != 1)
                {
                    query.SortOrder = table.getAttribute('data-q-sort-order');
                    query.Page = table.getAttribute('data-q-page');
                    query.PageSize = table.getAttribute('data-q-page-size');
                    query.SearchText = ENtoRU(($('#leaders__Search').val() || '').trim());
                }

                return JSON.stringify(query);
            };
    function filter__PartialListStudyGroup_Leaders() {
                var table = document.getElementById('tbl__PartialListStudyGroup_Leaders');
                table.setAttribute('data-q-page', '');
                loadTableByQueryAsyncV2(table, 'div-StudyGroup_Leaders', getQuery__PartialListStudyGroup_Leaders, this);
                return false;
            }

            function filter_clear__PartialListStudyGroup_Leaders() {
                var table = document.getElementById('tbl__PartialListStudyGroup_Leaders');
                table.setAttribute('data-q-state', '1');
                loadTableByQueryAsyncV2(table, 'div-StudyGroup_Leaders', getQuery__PartialListStudyGroup_Leaders, this);
                return false;
            }

            $(function()
            {
                $('#leaders__Pager a').on('click', function() {
                    var table = document.getElementById('tbl__PartialListStudyGroup_Leaders');
                    var parts = this.href.split('/')
                    var page = 0;
                    if(parts.length > 0) {
                        page = parts[parts.length - 1];
                    }
                    table.setAttribute('data-q-page', page);
                    loadTableByQueryAsyncV2(table, 'div-StudyGroup_Leaders', getQuery__PartialListStudyGroup_Leaders, this);
                    return false;
                });

                $('#leaders__Pager select:first').change(function() {
                    var table = document.getElementById('tbl__PartialListStudyGroup_Leaders');
                    table.setAttribute('data-q-page-size', $(this).val());
                    table.setAttribute('data-q-page', 1);
                    loadTableByQueryAsyncV2(table, 'div-StudyGroup_Leaders', getQuery__PartialListStudyGroup_Leaders, this);
                });

                $('#leaders__Filter').on('click', function() {
                    filter__PartialListStudyGroup_Leaders();
                });

                $('#leaders__FilterClear').on('click', function() {
                    filter_clear__PartialListStudyGroup_Leaders();
                });

                $('#leaders__Search').keypress(function(e) {
                    if (e.which === 13)
                    {
                        filter__PartialListStudyGroup_Leaders();
                    }
                });

                $('#tbl__PartialListStudyGroup_Leaders thead tr th a[data-col-name]').on('click', function(e) {
                    var table = document.getElementById('tbl__PartialListStudyGroup_Leaders');
                    if (!e.shiftKey)
                    {
                        table.setAttribute('data-q-sort-order', '');
                    }
                    processSortOrder(table, this);
                    loadTableByQueryAsyncV2(table, 'div-StudyGroup_Leaders', getQuery__PartialListStudyGroup_Leaders, this);
                    return false;
                });
            });
</script>
