

<script type="text/javascript">
    function ajaxS2_ddl_FilterInstitute() {
        var select2 = $('#ddl_FilterInstitute').select2({
            language: 'ru'
            , width: 'style'
            , theme: 'bootstrap-5'
            , selectionCssClass: "select2--small"
            , dropdownCssClass: "select2--small"
            , placeholder: 'Институт'
            , allowClear: true
            , minimumInputLength: 2
            , ajax: {
                url: '/bars_web/SG/JSON/JSON_AE_inst'
                , data: function (params) {
                    return {
                        'searchText': clearBadInput(params.term)
                    };
                }
                , dataType: 'json'
                , cache: false
                , processResults: function (data) {
                    var results = $.map(data,
                        function (obj) {
                            return { id: obj.id, text: obj.disabled ? 'Неактивно: ' + obj.text : obj.text };
                        });

                    return {
                        results: S2_processResults_Message(results, 30)
                    };
                }
            }
            , templateResult: S2_templateResult_Message
        });
        return select2;
    }

    function getQuery__PartialListStudyGroup()
    {
        var table = document.getElementById('tbl__PartialListStudyGroup');
        var query = { };
        query.ID = table.getAttribute('data-q-id');
        query.State = table.getAttribute('data-q-state');

        if (query.State !== "1")
        {
            query.SortOrder = table.getAttribute('data-q-sort-order');
            query.Page = table.getAttribute('data-q-page');
            query.PageSize = table.getAttribute('data-q-page-size');
            query.SearchText = ENtoRU($('#studyGroup__Search').val().trim());

            query.FilterDisplayName = ENtoRU($('#tb_FilterDisplayName').val().trim());
            query.FilterFormationYear = $('#tb_FilterFormationYear').val().trim();
            query.FilterCourse = $('#tb_FilterCourse').val().trim();

            query.FilterSubfacultyName = ENtoRU($('#tb_FilterSubfacultyName').val().trim());
            query.FilterAE_OrganizationName = ENtoRU($('#tb_FilterAE_OrganizationName').val().trim());

            query.FilterEmail = $('#tb_FilterEmail').val().trim();

            query.FilterDegree = {};
            var ddl_FilterDegree = $("#ddl_FilterDegree");
            if (ddl_FilterDegree.length !== 0) {
                query.FilterDegree.Value = ddl_FilterDegree.find("option:selected").val();
            }

            query.FilterTrainingForm = {};
            var ddl_FilterTrainingForm = $("#ddl_FilterTrainingForm");
            if (ddl_FilterTrainingForm.length !== 0) {
                query.FilterTrainingForm.Value = ddl_FilterTrainingForm.find("option:selected").val();
            }

            query.FilterInstitute = {};
            var ddl_FilterInstitute = $("#ddl_FilterInstitute");
            if (ddl_FilterInstitute.length !== 0) {
                query.FilterInstitute.Value = ddl_FilterInstitute.find("option:selected").val();
            }
        }

        return JSON.stringify(query);
    };

    $(document).ready(function () {
        var ddl_FilterInstitute = ajaxS2_ddl_FilterInstitute();
        var ddl_FilterDegree = S2_simpleSmall("#ddl_FilterDegree", -1);
        var ddl_FilterTrainingForm = S2_simpleSmall("#ddl_FilterTrainingForm", -1);

        $('#tb_FilterDisplayName,#tb_FilterFormationYear,#tb_FilterCourse,#tb_FilterSubfacultyName,#tb_FilterAE_OrganizationName,#tb_FilterEmail').keypress(function(e) {
            if (e.which !== 13)
                return;

            filter__PartialListStudyGroup();
        });

        ddl_FilterInstitute.on('select2:select', function (e) {
            filter__PartialListStudyGroup();
        });

        ddl_FilterInstitute.on('select2:clear', function (e) {
            filter__PartialListStudyGroup();
        });

        ddl_FilterDegree.on('select2:select', function (e) {
            filter__PartialListStudyGroup();
        });

        ddl_FilterTrainingForm.on('select2:select', function (e) {
            filter__PartialListStudyGroup();
        });

        S2_SearchFieldFocusForJQSelector('*');
    });
</script>

<script type="text/javascript">
    function filter__PartialListStudyGroup() {
                var table = document.getElementById('tbl__PartialListStudyGroup');
                table.setAttribute('data-q-page', '');
                loadTableByQueryAsyncV2(table, 'div-StudyGroup', getQuery__PartialListStudyGroup, this);
                return false;
            }

            function filter_clear__PartialListStudyGroup() {
                var table = document.getElementById('tbl__PartialListStudyGroup');
                table.setAttribute('data-q-state', '1');
                loadTableByQueryAsyncV2(table, 'div-StudyGroup', getQuery__PartialListStudyGroup, this);
                return false;
            }

            $(function()
            {
                $('#studyGroup__Pager a').on('click', function() {
                    var table = document.getElementById('tbl__PartialListStudyGroup');
                    var parts = this.href.split('/')
                    var page = 0;
                    if(parts.length > 0) {
                        page = parts[parts.length - 1];
                    }
                    table.setAttribute('data-q-page', page);
                    loadTableByQueryAsyncV2(table, 'div-StudyGroup', getQuery__PartialListStudyGroup, this);
                    return false;
                });

                $('#studyGroup__Pager select:first').change(function() {
                    var table = document.getElementById('tbl__PartialListStudyGroup');
                    table.setAttribute('data-q-page-size', $(this).val());
                    table.setAttribute('data-q-page', 1);
                    loadTableByQueryAsyncV2(table, 'div-StudyGroup', getQuery__PartialListStudyGroup, this);
                });

                $('#studyGroup__Filter').on('click', function() {
                    filter__PartialListStudyGroup();
                });

                $('#studyGroup__FilterClear').on('click', function() {
                    filter_clear__PartialListStudyGroup();
                });

                $('#studyGroup__Search').keypress(function(e) {
                    if (e.which === 13)
                    {
                        filter__PartialListStudyGroup();
                    }
                });

                $('#tbl__PartialListStudyGroup thead tr th a[data-col-name]').on('click', function(e) {
                    var table = document.getElementById('tbl__PartialListStudyGroup');
                    if (!e.shiftKey)
                    {
                        table.setAttribute('data-q-sort-order', '');
                    }
                    processSortOrder(table, this);
                    loadTableByQueryAsyncV2(table, 'div-StudyGroup', getQuery__PartialListStudyGroup, this);
                    return false;
                });
            });
</script>
