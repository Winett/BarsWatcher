

<script>
        function getQuery__PartialListStudent() {
            var table = document.getElementById('tbl__PartialListStudent');
            var query = {};
            query.State = table.getAttribute('data-q-state');

            if (query.State !== "1") {
                query.SortOrder = table.getAttribute('data-q-sort-order');
                query.Page = table.getAttribute('data-q-page');
                query.PageSize = table.getAttribute('data-q-page-size');
                query.SearchText = ENtoRU($('#student__Search').val().trim());

                query.FilterFIO = ENtoRU($('#tb_FilterFIO').val().trim());
                query.FilterNumberOfCreditBook = ENtoRU($('#tb_FilterNumberOfCreditBook').val().trim());
                query.FilterTrainingStatus = ENtoRU($('#tb_FilterTrainingStatus').val().trim());
                query.FilterStudyGroupName = ENtoRU($('#tb_FilterStudyGroupName').val().trim());
                query.FilterInstituteName = ENtoRU($('#tb_FilterInstituteName').val().trim());
                query.FilterAE_OrganizationName = ENtoRU($('#tb_FilterAE_OrganizationName').val().trim());
            }

            return JSON.stringify(query);
        }

        $(document).ready(function () {
            $('#tb_FilterFIO, #tb_FilterNumberOfCreditBook, #tb_FilterTrainingStatus, #tb_FilterStudyGroupName, #tb_FilterSubfacultyName, #tb_FilterInstituteName, #tb_FilterAE_OrganizationName').keypress(function (e) {
                if (e.which !== 13)
                    return;

                filter__PartialListStudent();
            });
        });
</script>

<script type="text/javascript">
    function filter__PartialListStudent() {
                var table = document.getElementById('tbl__PartialListStudent');
                table.setAttribute('data-q-page', '');
                loadTableByQueryAsyncV2(table, 'div-Student', getQuery__PartialListStudent, this);
                return false;
            }

            function filter_clear__PartialListStudent() {
                var table = document.getElementById('tbl__PartialListStudent');
                table.setAttribute('data-q-state', '1');
                loadTableByQueryAsyncV2(table, 'div-Student', getQuery__PartialListStudent, this);
                return false;
            }

            $(function()
            {
                $('#student__Pager a').on('click', function() {
                    var table = document.getElementById('tbl__PartialListStudent');
                    var parts = this.href.split('/')
                    var page = 0;
                    if(parts.length > 0) {
                        page = parts[parts.length - 1];
                    }
                    table.setAttribute('data-q-page', page);
                    loadTableByQueryAsyncV2(table, 'div-Student', getQuery__PartialListStudent, this);
                    return false;
                });

                $('#student__Pager select:first').change(function() {
                    var table = document.getElementById('tbl__PartialListStudent');
                    table.setAttribute('data-q-page-size', $(this).val());
                    table.setAttribute('data-q-page', 1);
                    loadTableByQueryAsyncV2(table, 'div-Student', getQuery__PartialListStudent, this);
                });

                $('#student__Filter').on('click', function() {
                    filter__PartialListStudent();
                });

                $('#student__FilterClear').on('click', function() {
                    filter_clear__PartialListStudent();
                });

                $('#student__Search').keypress(function(e) {
                    if (e.which === 13)
                    {
                        filter__PartialListStudent();
                    }
                });

                $('#tbl__PartialListStudent thead tr th a[data-col-name]').on('click', function(e) {
                    var table = document.getElementById('tbl__PartialListStudent');
                    if (!e.shiftKey)
                    {
                        table.setAttribute('data-q-sort-order', '');
                    }
                    processSortOrder(table, this);
                    loadTableByQueryAsyncV2(table, 'div-Student', getQuery__PartialListStudent, this);
                    return false;
                });
            });
</script>
