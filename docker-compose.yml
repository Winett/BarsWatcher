# Тестовый стенд BarsWatcher.
# Запуск:  docker compose up -d --build
# Логи:    docker compose logs -f bot worker
# .env обязателен (см. .env.example); DB_HOST и REDIS_URL здесь
# переопределяются на имена контейнеров.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-barswatcher}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-barswatcher}
      POSTGRES_DB: ${DB_NAME:-barswatcher}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.0.15-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # RDB-снимки отключены полностью: их фоновое сохранение падало (диск /
    # память) и блокировало ВСЮ запись (MISCONF / stop-writes-on-bgsave-error).
    # Персистентность — только AOF (appendonly), запись не блокируется.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "",
        "--stop-writes-on-bgsave-error",
        "no",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # одноразовый запуск миграций перед стартом bot/worker
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    command: ["python", "bot.py"]
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./attachments_cache:/app/attachments_cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./logs:/app/logs
      - ./attachments_cache:/app/attachments_cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
